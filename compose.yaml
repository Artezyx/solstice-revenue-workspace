services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solstice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-solstice}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 15
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SOLSTICE_JWT_SECRET: ${SOLSTICE_JWT_SECRET:?Set SOLSTICE_JWT_SECRET}\n      SOLSTICE_JWT_ISSUER: ${SOLSTICE_JWT_ISSUER:-solstice-local}\n      SOLSTICE_JWT_AUDIENCE: ${SOLSTICE_JWT_AUDIENCE:-solstice-api}
      PORT: 8093
    ports: ["8093:8093"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  pg-data:
